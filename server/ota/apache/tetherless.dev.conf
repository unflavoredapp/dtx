# Apache vhost for tetherless.dev OTA pack hosting.
# Enable: copy to /etc/apache2/sites-available/ and a2ensite tetherless.dev
# Docroot should contain the contents of server/ota/public/

<VirtualHost *:80>
    ServerName tetherless.dev
    ServerAlias www.tetherless.dev
    DocumentRoot /var/www/tetherless.dev
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName tetherless.dev
    ServerAlias www.tetherless.dev
    DocumentRoot /var/www/tetherless.dev

    SSLEngine on
    # Apex HTTPS for the site itself (certbot / existing LE for tetherless.dev):
    SSLCertificateFile      /etc/letsencrypt/live/tetherless.dev/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/tetherless.dev/privkey.pem

    <Directory /var/www/tetherless.dev>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # pack.json must be fetchable without auth (the iOS app pulls it on launch).
    <Files "pack.json">
        Header set Cache-Control "no-store"
        Header set Access-Control-Allow-Origin "*"
    </Files>
</VirtualHost>
